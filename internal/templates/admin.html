<!DOCTYPE html>
<html>
    <head>
        <title>Kortpress-Student-ID admin panel</title>
        <style>
            body { font-family: Arial, Helvetica, sans-serif; padding: 10px;}
        </style>
    </head>
    <body>
        <h1>digitale Schülerausweise</h1>
        <h2>Administrations-Bereich</h2>
        <div>
            <table><tr>
            <td><b>Datenabgleich</b></td>
            <td><button onclick="document.location='{{@BASE}}/admin/check'">Ausgetretene auflisten</button><br /></td>
            <td><button onclick="start('cleanup')">Ausgetretene löschen</button><br /></td></tr><tr ><td></td>
            <td><button onclick="document.location='{{@BASE}}/admin/doubleList'">Doppelt ausgestellte anzeigen</button><br /></td>
            <td><button onclick="document.location='{{@BASE}}/admin/double'">Doppelt ausgestellte löschen</button><br /></td></tr><tr ><td></td>
            <td><button onclick="start('expungeList')">Gelöschte anzeigen</button><br /></td>
            <td><button onclick="start('expunge')">Gelöschte Passes entfernen</button><br /></td></tr><tr ><td></td>
            <td><button onclick="start('checkDBstart')">IDs abgleichen</button><br /></td>
            
            </tr><tr>
            <td><b>Verlängern</b></td>
            <td><button onclick="document.location='{{@BASE}}/admin/renew'">gültige um aktuelles Schuljahr verlängern</button></td>
            <td><button onclick="document.location='{{@BASE}}/admin/reissue-all'">alle Ausweise neu ausstellen (Vorsicht)</button></td>
            </tr>
            <tr>
                <form method="POST" action="{{@BASE}}/admin/reissue" autocomplete="off"><td>
                    <input type="text" placeholder="Schüler-ID/login" name="searchID" autocomplete="nothanks" /></td>
                <td><button type="submit">Ausweis neu ausstellen</button></td>
                </form>
            </tr>
            <tr>
                <form method="POST" action="{{@BASE}}/admin/update" autocomplete="off"><td>
                    <input type="text" placeholder="Schüler-ID/login" name="searchID" autocomplete="nothanks" /></td>
                <td><button type="submit">Ausweis aktualisieren</button></td>
                </form>
            </tr>
            <tr>
                <form method="POST" action="{{@BASE}}/admin/delete" autocomplete="off"><td>
                    <input type="text" placeholder="Schüler-ID/login" name="dsearchID" autocomplete="nothanks" 
                     style="border-color: #f88; background-color:#fdd" /></td>
                <td><button type="submit" style="background-color: #fdd;">Einzelnen Ausweis löschen</button></td>
                </form></tr>
            </table>
        </div>
        <div style="margin-top: 10px;"><b>Status:</b><br />Ausgegebene Ausweise: {{@numPasses}}<br />
        <!-- p style="white-space: pre-line" -->
            {{@message | nl2br,raw}}

        </div>
        <pre id="status" style="margin-top: 10px; font-weight: bold; border: 1px solid #ddd; background-color:#eee;"></pre>
        <script>

        function start(action) {
            const evtSource = new EventSource("{{@BASE}}/admin/" + action);
            document.querySelectorAll('button').forEach(btn => btn.disabled = true);
            evtSource.onmessage = (e) => {
                const data = JSON.parse(e.data);
                document.getElementById("status").textContent = data.msg;

                if (data.done) {
                    evtSource.close(); // Verbindung beenden
                    document.querySelectorAll('button').forEach(btn => btn.disabled = false);
                }
            };

            evtSource.onerror = (e) => {
                document.querySelectorAll('button').forEach(btn => btn.disabled = false);
                console.error("SSE Error Event:", e);
                let msg = "Fehler bei der Verbindung";
                if (e.readyState === EventSource.CLOSED) {
                    msg += " (Verbindung geschlossen)";
                }
                document.getElementById("status").textContent = msg;
                evtSource.close();
            };
        }
        </script>
    </body>
</html>
