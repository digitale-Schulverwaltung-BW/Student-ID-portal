<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Student-ID Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-4">
    <h1 class="mb-1"><i class="bi bi-person-badge"></i> Digitale Schülerausweise</h1>
    <h5 class="text-secondary mb-4">Administrationsbereich</h5>

    <!-- Verlängern & Einzelaktionen -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-arrow-clockwise"></i> Verlängern</h5>
            <div class="row g-2 mb-3">
                <div class="col-md-6 d-grid">
                    <form method="POST" action="{{@BASE}}/admin/renew">
                        <button class="btn btn-outline-success w-100" type="submit">
                            <i class="bi bi-calendar-check"></i> gültige um aktuelles Schuljahr verlängern
                        </button>
                    </form>
                </div>
            </div>

            <!-- Einzelaktionen -->
            <form class="input-group mb-2" method="POST" action="{{@BASE}}/admin/reissue" autocomplete="off">
                <input id="firstInput" type="text" class="form-control"
                    placeholder="Schüler-ID oder Kennung" name="searchID" autocomplete="off">
                <button class="btn btn-outline-secondary" type="submit">
                    <i class="bi bi-arrow-repeat"></i> Ausweis neu ausstellen
                </button>
            </form>

            <form class="input-group mb-2" method="POST" action="{{@BASE}}/admin/update" autocomplete="off">
                <input type="text" class="form-control"
                    placeholder="Schüler-ID oder Kennung" name="searchID" autocomplete="off">
                <button class="btn btn-outline-secondary" type="submit">
                    <i class="bi bi-arrow-up-circle"></i> Ausweis aktualisieren
                </button>
            </form>

            <form class="input-group" method="POST" action="{{@BASE}}/admin/delete" autocomplete="off">
                <input type="text" class="form-control border-danger bg-light"
                    placeholder="Schüler-ID oder Kennung zum Löschen" name="dsearchID" autocomplete="off">
                <button class="btn btn-outline-danger" type="submit">
                    <i class="bi bi-trash"></i> Einzelnen Ausweis löschen
                </button>
            </form>

        </div>
    </div>

    <!-- Wallet-Status -->
    <div class="card shadow-sm mb-4">
    <div class="card-body">
        <h5 class="card-title mb-3">
            <i class="bi bi-wallet2"></i> Wallet-System
        </h5>
        <div class="row g-3 text-center">
            <div class="col-md-4">
                <div class="border rounded p-3">
                    <div class="fs-2 fw-bold text-success">{{@stats.active}}</div>
                    <small class="text-muted">Aktive Ausweise</small>
                </div>
            </div>
            <div class="col-md-4">
                <div class="border rounded p-3">
                    <div class="fs-2 fw-bold text-secondary">{{@stats.voided}}</div>
                    <small class="text-muted">Gelöschte Ausweise</small>
                </div>
            </div>
            <div class="col-md-4">
                <div class="border rounded p-3">
                    <div class="fs-2 fw-bold text-primary">{{@stats.themes}}</div>
                    <small class="text-muted">Themes</small>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Meldungen -->
    <check if="{{@message}}">
    <true>
    <div class="card shadow-sm">
    <div class="card-body">
        <h5 class="card-title mb-0">
            <i class="bi bi-info-circle"></i> Ergebnis
        </h5>
        <p class="text-muted mt-2" style="white-space: pre-line;">{{@message}}</p>
    </div>
    </div>
    </true>
    </check>


</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
